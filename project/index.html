<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiddenMotive</title>
    <script src="javaScripts/main-script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="content01">
        <img src="img/playButton.png" alt="PlayButton" id="playButton" onclick="animatePlayButton()">
        <img src="img/tutorialButton.png" alt="TutorialButton" id="tutorialButton" onclick="animatTutorialButton()">
    </div>

    <div id="content02">
        <div id="levelContainer">
            <div>01</div>
            <div>02</div>
            <div>03</div>
        </div>

        <div id="infoText">
            <p>LEVEL</p>
        </div>

    </div>

    <div id="content03">

        <div id="infoText">
            <p>TUTORIAL</p>
        </div>

        <div id="tutorialContainer">

            <img src="img/detektiv.png" alt="" id="detekivErklaert">
            <img src="img/bubble.webp" alt="" id="bubbleErklaert">

            <div id="textContainerErklaert">
                <div class="slide active">
                    <p>Text 1: Lorem ipsum dolor sit amet...</p>
                </div>
                <div class="slide">
                    <p>Text 2: Anderer Inhalt hier...</p>
                </div>
                <div class="slide">
                    <p>Text 3: Noch mehr Text...</p>
                </div>

                <button id="prevBtn">←</button>
                <button id="nextBtn">→</button>
            </div>
        </div>
    </div>

    <div id="content04">
        4
    </div>

    <div id="content05">
        5
    </div>

    <div id="content06">
        6
    </div>

    <div id="content07">
        7
    </div>
</body>

</html>
